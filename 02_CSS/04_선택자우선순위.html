<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        /* 전체 */
        * {
            color: red;
        }
        
        /* 태그 */
        div{
            background: blue;
            color: aqua;
        }

        /* 아이디 */
        #test1 {
            background: rebeccapurple;
        }

        /* 클래스 */
        .test1 {
            background: olive;
        }
        /* 클래스보다 인라인이 우선이라 적용안됨 때문에 important 사용 */
        .test2 {
            background: darkorange !important;
        }
    </style>
</head>
<body>
    <h1>선택자 우선수위</h1>
    <pre>
    CSS는 기본적으로 위에서 아래로 적용이 된다.
    같은 태그 요소에 여러 개의 css 속성이
    설정이 된 경우에는 우선순위에 따라서
    스타일이 적용되게 된다.
    </pre>
    <hr>
    <h3>선택자 우선순위 계급</h3>
    <pre>
        <strong>
            !important > 인라인 선택자 > 아이디 선택자
            > 클래스 선택자 > 태그 선택자 > 전체 선택자
        </strong>
    </pre>
    <hr>
    <h3>선택자 우선순위 테스트</h3>
    <!-- div#test1.test1{우선순위테스트} -->
    <div id="test1" class="test1">우선순위테스트</div>
    <hr>
    <!-- 태그 내부에 css를 속성으로 정의하는 것을 인라인 방식이라고 한다. -->
    <div id="test2" class="test2" style="background: green;">우선순위테스트</div>
</body>
</html>
