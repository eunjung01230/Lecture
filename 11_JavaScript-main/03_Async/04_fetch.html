<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>04. fetch</h1>
    <pre>
        가장 대표적인 비동기 처리는 외부 서버의 API
        호출하는 것이다. 
    </pre>

    <button id="btn-get"> 리뷰 목록 불러오기</button>
    <script>

        document.getElementById("btn-get")
                .addEventListener('click', getReviews);
        /* 
            프로그램 요구사항 
            1. 리뷰 목록 버튼을 누르면 리뷰 관련 데이터를 노출한다. 
        */

        //function getReviews() / data를 쓸때는 필요없음 
        // await를 쓸려면 async 무조건 
        async function getReviews() {
            // 외부 API를 호출 
            const data = fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');
            console.log(data);

            // 현재 data라는 변수는 promise 객체 
            // promise 객체는 읽기 전용으로 사용할 수 없다. 

            // 1. promise - then() 
            // data
            //     .then(res => {
            //         console.log(res);
            //         // res에는 api의 호출 결과가 문자열 json로 
            //         // 되어 있다. json -> 자바스크립트 객체 표기법 
            //         // 문자열 json을 실제 자바스크립트 객체로 바꾸기 위해서 
            //         // res.json()을 호출하면 된다. 
            //         return res.json();
            //     })
            //     .then(json => console.log(json));

            //========================================
            // 2. async - await
            const res = await data; // 문자열 json
            const reviews = await res.json(); // js 객체 변화 

            console.log(reviews);
            console.log(reviews[0].title);
        }
    </script>
</body>
</html>
