<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02_event-object_plus</title>
    <style>
        .map {
            width: 200px;
            height: 200px;
            background: lightgray;
        }
    </style>
</head>
<body>
    <h1>02. 이벤트 객체와 this</h1>

    <h2>1) 이벤트 객체</h2>
    <h3 class="message">:round_pushpin: 배달 받을 위치를 아무 곳이나 클릭해 보세요!</h3>
    <div class="map" onmouseover="showMapCoords(event)">
        지도 영역 내부를 클릭해 보세요!
    </div>

    <h2>2) 이벤트 핸들러 내부의 this</h2>
    <h3>이벤트 핸들러 어트리뷰트</h3>
    <button onclick="handleClick1()">떡볶이</button>
    <button onclick="handleClick2(this)">순대</button>

    <h3>이벤트 핸들러 프로퍼티, addEventListener</h3>
    <button id="btn1">김밥</button>
    <button id="btn2">라면</button>

    <h3>화살표 함수</h3>
    <button id="btn3">튀김</button>
    <button id="btn4">어묵</button>

    <script>
        const $msg = document.querySelector('.message');

        /*
            이벤트를 등록하게 되면 내부적으로 이벤트 객체가 생기게 된다.
            이벤트 객체는 매개변수로 전달 받을 수 있으며,
            해당 값을 참조하거나 변경하거나 제거할 수 있게 된다.
        */
        function showCoords(e) {
            console.log(e);
            $msg.textContent = `배달 위치 : ${e.clientX}. ${e.clientY}`;
        }

        // html 전역에 onClick 이벤트 등록
        document.onclick = showCoords;

        //div 추출
        const $map = document.querySelector('.map');

        function showMapCoords(e) {
            console.log(e);
            $map.textContent = `배달 위치 : ${e.clientX}. ${e.clientY}`;
        }

        // 2) 이벤트 핸들러 내부의 this
        function handleClick1() {
            // 일반 함수 내부에서 this를 출력하게 되면
            // 전역 객체인 window 객체를 반환한다.
            console.log('click1', this);
        }

        function handleClick2(btn) {
            // 함수 호출 시 this를 전달해주게 되면
            // 이벤트를 가지고 있는 DOM 요소를 반환한다.
            console.log('click2', btn);
            /*
                이벤트 함수에서 this는 이벤트 대상 DOM 요소이다.
                따라서 이벤트 발생 시 해당 DOM을 없애거나
                추가적인 동작을 더 추가하고자 하면 this를 활용해서 작업을 할 수 있게 된다.
            */
        }


        // ========== 이벤트 핸들러 프로퍼티, addEventListener ==========
        const $btn1 = document.getElementById('btn1');
        const $btn2 = document.getElementById('btn2');

        // [김밥] 이벤트 핸들러 프로퍼티 방식
        // 일반 함수(function)로 등록하면 this는 이벤트를 바인딩한 DOM 요소를 가리킨다.
        $btn1.onclick = function(e) {
            console.log('김밥 this :', this);                       // <button id="btn1">김밥</button>
            console.log('김밥 e.currentTarget :', e.currentTarget); // this와 같은 요소
            console.log(this === e.currentTarget);                  // true
        };

        // [라면] addEventListener 방식
        // addEventListener에 일반 함수를 넘겨도 this는 이벤트를 바인딩한 DOM 요소를 가리킨다.
        $btn2.addEventListener('click', function(e) {
            console.log('라면 this :', this);                       // <button id="btn2">라면</button>
            console.log('라면 e.currentTarget :', e.currentTarget); // this와 같은 요소
            console.log(this === e.currentTarget);                  // true

            // this가 버튼 자신이므로 버튼을 직접 조작할 수 있다.
            this.textContent = '라면 주문 완료!';
        });


        // ========== 화살표 함수 ==========
        const $btn3 = document.getElementById('btn3');
        const $btn4 = document.getElementById('btn4');

        /*
            화살표 함수는 자기만의 this를 가지지 않는다.
            그래서 화살표 함수 내부의 this는 바깥(상위 스코프)의 this를 그대로 사용한다.
            여기서 바깥은 전역이므로 this는 window 객체가 된다.
        */

        // [튀김] 이벤트 핸들러 프로퍼티 + 화살표 함수
        $btn3.onclick = (e) => {
            console.log('튀김 this :', this);                       // window
            console.log('튀김 e.currentTarget :', e.currentTarget); // <button id="btn3">튀김</button>
            console.log(this === e.currentTarget);                  // false
        };

        // [어묵] addEventListener + 화살표 함수
        $btn4.addEventListener('click', (e) => {
            console.log('어묵 this :', this);                       // window
            console.log('어묵 e.currentTarget :', e.currentTarget); // <button id="btn4">어묵</button>

            // 화살표 함수에서는 this가 버튼이 아니므로
            // 이벤트가 바인딩된 요소가 필요하면 e.currentTarget을 사용한다.
            e.currentTarget.textContent = '어묵 주문 완료!';
        });
    </script>
</body>
</html>
