<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>순서 없는 목록 태그</h2>
    <ul>
        <li>HTML</li>
        <li>css</li>
        <li>JS</li>
    </ul>
    <!--ul>li*3-->
    <hr>
    <h2>순서가 있는 목록 태그</h2>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    <hr>
    <ol type="a">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    <hr>
    <ol type="A">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    <hr>
    <ol type="I"> <!--속성을 추가하면 많은 변환이 가능 키와벨류가 존재-->
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    <hr>
</body>
</html>
