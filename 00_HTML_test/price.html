<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배송비 안내</title>
</head>
<body>
    <table border="2"> <!-- tr*3>th*3 -->
        <caption>주문 금액별 배송비</caption>
        <tr>
            <td>주문 금액</td>
            <td>기본 배송비</td>
            <td>도서산간 추가</td>
        </tr>
        <tr>
            <td>3만원 미만</td>
            <td>3,000원</td>
            <td>3,000원</td>
        </tr>
        <tr>
            <td>3만원 이상</td>
            <td>무료</td>
            <td>3,000원</td>
        </tr>
        <tr>
            <td>10만원 이상</td>
            <td>무료</td>
            <td>무료</td>
        </tr>
</body>
</html>
