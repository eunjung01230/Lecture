<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>배송 요금표</title>
  </head>
  <body>

    <h2>배송 요금표</h2>

    <table border="1">
      <caption>배송 방법별 요금</caption>
      <thead>
        <tr>
          <th>구분</th>
          <th>상품</th>
          <th colspan="2">배송 방법</th>
          <th colspan="2">요금</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th rowspan="4">일반</th>
          <td rowspan="2">도서</td>
          <td colspan="2">택배</td>
          <td colspan="2">3,000원</td>
        </tr>
        <tr>
          <td colspan="2">방문</td>
          <td colspan="2">0원</td>
        </tr>
        <tr>
          <td rowspan="2">의류</td>
          <td colspan="2">택배</td>
          <td colspan="2">3,000원</td>
        </tr>
        <tr>
          <td colspan="2">방문</td>
          <td colspan="2">0원</td>
        </tr>
        <tr>
          <th rowspan="2">특급</th>
          <td>도서</td>
          <td colspan="2" rowspan="2">택배</td>
          <td colspan="2" rowspan="2">6,000원</td>
        </tr>
        <tr>
          <td>의류</td>
        </tr>
      </tbody>
    </table>

  </body>
</html>
