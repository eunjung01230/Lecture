<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>묶는 방법 두가지</title>
</head>
<body>
    <h1>div로 묶으면</h1>
    <div>커피내리기</div>
    <div>영화 보기</div>
    <div>주말 산책</div>

    <h1>span으로 묶으면</h1>
    <span>커피내리기</span>
    <span>영화보기</span>
    <span>주말산책</span>
</body>
</html>
